name: DevSecOps & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-build-check:
    name: Security Audit & Build Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install

      - name: Dependency Security Audit (Backend)
        run: pnpm run audit:deps -w backend
        continue-on-error: true

      - name: Generate Prisma Client
        run: pnpm exec prisma generate --schema=backend/prisma/schema.prisma

      - name: Typecheck Backend
        run: pnpm run build -w backend

      - name: Typecheck & Build Frontend
        run: pnpm run build -w frontend
